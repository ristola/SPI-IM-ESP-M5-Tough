; PlatformIO Project Configuration File
;
; Project: RTSNow SPI-CCP - one of the RTSNow product line's OEM-specific
; firmware projects (see ~/Development/RTSNow/ for siblings, e.g. RTSNow-
; Piovan for Modbus-over-485/Ethernet equipment, RTSNow-Moretto). This one
; is scoped specifically to the legacy SPI-CCP protocol (Society of the
; Plastics Industry, Committee on Communication Protocol) that FC/FD/FN/
; ADV/CD dryers and FC/FN crystallizers speak over RS-485 - see lib/SpiCcp.
; Moved (2026-09-19) from its original location ("SPI-IM ESP M5 Tough",
; directly under ~/Development/) to ~/Development/RTSNow/RTSNow-SPI-CCP -
; formerly a sibling of RTS-ESPNOW-Gateway (also moved the same day, to
; ~/Development/RTSNow/RTSNow-Gateway - see this file's lib_extra_dirs
; below for the one functional cross-reference that move required fixing).
;
; Two board families, three firmware roles:
;
; - M5Stack Tough (ESP32, 16MB flash, 8MB PSRAM, 320x240 ILI9342 SPI,
;   capacitive FT6336U touch). PlatformIO has no dedicated "m5stack-tough"
;   board entry - Tough shares the same MCU/flash/PSRAM configuration as
;   M5Stack Core2, so the core2 board profile is used here. M5Unified's
;   M5.begin() auto-detects the actual Tough hardware at runtime for
;   GPIO/panel/touch wiring. Two roles: "gateway" is the one unit with the
;   Modbus TCP server; "node" units sit at each dryer, poll it over SPI-CCP
;   (FN-MAIN/SPI-IM) and broadcast readings to the gateway over ESP-NOW.
;   Both roles share src/main.cpp and get the full touchscreen UI.
;
; - M5Stack AtomS3 Lite or classic Atom Lite (no display/touch/SD/RTC on
;   either) - cheap boards to develop the "node" role on before committing
;   to a Tough (or, longer term, an M5Stack Atom Tough) per unit. Both share
;   one lean, display-free main (src/main_atom_node.cpp), status shown via
;   the onboard WS2812 LED instead of a screen. See that file's headerd
;   comment for what's dropped vs. src/main.cpp's node role (WiFiManager
;   captive-portal reconfig, RTC/NTP, SD). RS-485 pairing differs per board -
;   see include/pins.h's BOARD_ATOMLITE/BOARD_ATOMS3LITE sections: Atom Lite
;   pairs with an M5Stack ATOM Tail485 (manufacturer-confirmed compatible,
;   clips onto its pogo-pin tail), AtomS3 Lite pairs with a Grove RS485 Unit
;   (M5Stack doesn't list Tail485 as AtomS3-Lite-compatible, though the
;   pairing is being tried anyway via flying leads to its pogo-pin pads,
;   since the module is just a TTL-UART-to-RS485 converter electrically).
;
; All node builds (Tough, AtomS3 Lite, Atom Lite) also speak RTS-NOW - see
; ../RTSNow-Gateway/PROTOCOL.md - so they show up in that project's
; gateway/desktop app for discovery, renaming, and (once wired up) settings
; push. Pulled in via lib_extra_dirs below rather than a local copy, per
; that repo's own "Adding RTS-NOW to a new project" guidance.
;
; Flash the matching environment per physical unit.

[env]
platform = espressif32
board = m5stack-core2
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -Wall
    '-D BOARD_NAME="M5Tough"'
    -Iinclude

lib_deps =
    m5stack/M5GFX@^0.1.16
    m5stack/M5Unified@^0.1.17
    emelianov/modbus-esp8266@^4.1.0
    tzapu/WiFiManager@^2.0.17

; Shared RTSNow library (rtsnow_protocol.h wire format + rtsnow_node.h/.cpp
; "simple node" helper) - canonical source lives in the sibling
; RTSNow-Gateway repo, not copied here. Harmless to list for every
; environment: only src/main.cpp and src/main_atom_node.cpp actually
; #include it (all three node roles), so it's simply unused by env:gateway.
lib_extra_dirs =
    ../RTSNow-Gateway/libraries

; src/ has two mutually-exclusive main()s (main.cpp for the Tough,
; main_atom_node.cpp for the AtomS3 Lite/Atom Lite) - this base filter
; picks main.cpp; env:node_atoms3lite/env:node_atomlite below override it
; the other way.
build_src_filter =
    +<*>
    -<main_atom_node.cpp>

[env:gateway]
build_flags =
    ${env.build_flags}
    -D ROLE_GATEWAY

[env:node]
build_flags =
    ${env.build_flags}
    -D ROLE_NODE

; AtomS3 Lite development node - see the file header comment above and
; src/main_atom_node.cpp for what this build does and doesn't include.
; Deliberately does NOT inherit env's lib_deps (M5GFX/M5Unified/WiFiManager
; aren't needed without a display or captive-portal UI) or board=core2.
[env:node_atoms3lite]
board = m5stack-atoms3
; Default upload_speed bumps to 460800 mid-upload, which this board's native
; USB-Serial/JTAG peripheral (not a real UART) sometimes can't survive the
; switch to - "Changing baud rate to 460800" / "No serial data received"
; even right after a fresh unplug/replug. Staying at 115200 the whole time
; avoids the switch, but wasn't sufficient alone: esptool's flasher stub
; handoff itself (the "Uploading stub... Running stub..." step) also lost
; the connection ("Unable to verify flash chip connection") on this board's
; native USB peripheral even at a fixed baud rate, confirmed reproducible
; even right after a fresh unplug/replug (not the wedged-bootloader issue
; the comment above originally suspected). --no-stub skips that handoff
; entirely, talking to the ROM loader directly for the whole upload -
; slower, but this board's actual flash test only took ~6s longer than a
; stub upload typically does, and it's the difference between working and
; not on this specific board.
upload_speed = 115200
upload_flags =
    --no-stub
build_src_filter =
    +<*>
    -<main.cpp>
    -<BootLogo.cpp>
build_flags =
    -Wall
    '-D BOARD_NAME="AtomS3Lite"'
    -Iinclude
    -D ROLE_NODE
    -D BOARD_ATOMS3LITE
    ; Native USB-CDC needs this to get Serial at boot - see
    ; RTSNow-Gateway/node-firmware's platformio.ini for the same board
    ; needing the same flag.
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    emelianov/modbus-esp8266@^4.1.0
    adafruit/Adafruit NeoPixel@^1.12.3

; AtomS3 paired with the Atomic PoE Base (W5500 Ethernet-over-SPI, powered
; via 802.3af PoE) instead of an RS-485 tail/base module - see
; DeviceSettings.h's kEthernetModels, EthernetNode (the no-op
; EquipmentModel this build always ends up on), NetworkManager.cpp's
; BOARD_ATOMS3_POE branch, and include/pins.h's ETH_SCK/ETH_MISO/ETH_MOSI/
; ETH_CS pin comment for the real-hardware pin sourcing. Same
; src/main_atom_node.cpp as env:node_atoms3lite above, same upload quirks
; (see that env's own upload_speed/upload_flags comment - identical chip,
; same native-USB-CDC caveats), just a different bottom module and network
; transport.
[env:node_atoms3_poe]
board = m5stack-atoms3
upload_speed = 115200
upload_flags =
    --no-stub
build_src_filter =
    +<*>
    -<main.cpp>
    -<BootLogo.cpp>
build_flags =
    -Wall
    '-D BOARD_NAME="AtomS3POE"'
    -Iinclude
    -D ROLE_NODE
    -D BOARD_ATOMS3_POE
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    emelianov/modbus-esp8266@^4.1.0
    adafruit/Adafruit NeoPixel@^1.12.3
    m5stack/M5-Ethernet@^4.0.0

; Classic Atom Lite development node, paired with an M5Stack ATOM Tail485 -
; see include/pins.h's BOARD_ATOMLITE section for why this pairing (not
; AtomS3 Lite) is the one M5Stack's own docs/examples confirm works. Same
; src/main_atom_node.cpp as env:node_atoms3lite above; no native-USB-CDC
; flag needed here since this classic ESP32 board uses a regular USB-serial
; bridge chip, not the S3's native USB.
[env:node_atomlite]
board = m5stack-atom
build_src_filter =
    +<*>
    -<main.cpp>
    -<BootLogo.cpp>
build_flags =
    -Wall
    '-D BOARD_NAME="AtomLite"'
    -Iinclude
    -D ROLE_NODE
    -D BOARD_ATOMLITE
lib_deps =
    emelianov/modbus-esp8266@^4.1.0
    adafruit/Adafruit NeoPixel@^1.12.3

; OTA (over-the-air) variants - push firmware over WiFi instead of USB, once
; a unit is already running firmware with ArduinoOTA set up (see main.cpp).
; The auth password is read from the OTA_PASSWORD shell env var (must match
; secrets.h's OTA_PASSWORD) rather than being written here, since this file
; is committed to version control and secrets.h is not.
; Usage:
;   OTA_PASSWORD=<value from secrets.h> pio run -e gateway_ota -t upload --upload-port m5tough-gateway.local
;   OTA_PASSWORD=<value from secrets.h> pio run -e node_ota -t upload --upload-port <node's IP>
;   OTA_PASSWORD=<value from secrets.h> pio run -e node_atoms3lite_ota -t upload --upload-port <node's IP>
;   OTA_PASSWORD=<value from secrets.h> pio run -e node_atoms3_poe_ota -t upload --upload-port <node's IP>
;   OTA_PASSWORD=<value from secrets.h> pio run -e node_atomlite_ota -t upload --upload-port <node's IP>
[env:gateway_ota]
extends = env:gateway
upload_protocol = espota
upload_flags = --auth=${sysenv.OTA_PASSWORD}

[env:node_ota]
extends = env:node
upload_protocol = espota
upload_flags = --auth=${sysenv.OTA_PASSWORD}

[env:node_atoms3lite_ota]
extends = env:node_atoms3lite
upload_protocol = espota
upload_flags = --auth=${sysenv.OTA_PASSWORD}

[env:node_atoms3_poe_ota]
extends = env:node_atoms3_poe
upload_protocol = espota
upload_flags = --auth=${sysenv.OTA_PASSWORD}

[env:node_atomlite_ota]
extends = env:node_atomlite
upload_protocol = espota
upload_flags = --auth=${sysenv.OTA_PASSWORD}
